<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">UNIFIED Music</title>
  <desc id="desc">Local-first music, queue and audio intelligence product case study</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070914"/>
      <stop offset="0.55" stop-color="#14112b"/>
      <stop offset="1" stop-color="#231044"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#63f3d5"/>
      <stop offset="0.5" stop-color="#8d7cff"/>
      <stop offset="1" stop-color="#ff5ea8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1320" cy="150" r="280" fill="#8d7cff" opacity=".09"/>
  <circle cx="260" cy="790" r="340" fill="#63f3d5" opacity=".07"/>
  <g opacity=".2" stroke="#fff">
    <path d="M0 180H1600M0 360H1600M0 540H1600M0 720H1600"/>
    <path d="M320 0V900M640 0V900M960 0V900M1280 0V900"/>
  </g>
  <g transform="translate(120 520)" fill="url(#signal)" filter="url(#glow)">
    <rect x="0" y="-80" width="34" height="160" rx="17"/>
    <rect x="62" y="-145" width="34" height="290" rx="17"/>
    <rect x="124" y="-215" width="34" height="430" rx="17"/>
    <rect x="186" y="-120" width="34" height="240" rx="17"/>
    <rect x="248" y="-255" width="34" height="510" rx="17"/>
    <rect x="310" y="-175" width="34" height="350" rx="17"/>
    <rect x="372" y="-95" width="34" height="190" rx="17"/>
  </g>
  <g fill="#fff">
    <text x="640" y="345" font-family="Arial, Helvetica, sans-serif" font-size="30" letter-spacing="9" opacity=".65">LOCAL-FIRST MUSIC SYSTEM</text>
    <text x="640" y="470" font-family="Arial, Helvetica, sans-serif" font-size="132" font-weight="800" letter-spacing="-5">UNIFIED</text>
    <text x="648" y="545" font-family="Arial, Helvetica, sans-serif" font-size="38" letter-spacing="15" fill="#a99dff">MUSIC</text>
    <text x="648" y="650" font-family="Arial, Helvetica, sans-serif" font-size="26" opacity=".72">LIBRARY · QUEUE · PLAYBACK · AUDIO INTELLIGENCE</text>
  </g>
  <rect x="120" y="795" width="1360" height="2" fill="url(#signal)"/>
</svg>
